version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for routine minor/patch bumps; majors still arrive one per package.
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps
    ignore:
      # @astrojs/check only supports TypeScript ^5 || ^6; drop this once it accepts 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # Keeps SHA-pinned actions current, including the jmusick/ci shared workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    groups:
      actions:
        patterns: ["*"]
