version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for routine minor/patch bumps; majors still arrive one per package.
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps
